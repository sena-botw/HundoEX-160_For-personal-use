presets:
  Mappct:
    vars:
      - map-pct-items: .var(counter-location)
      - map-pct-items: .add(counter-korok)
      - map-pct-items: .add(counter-tower)
      - map-pct-items: .add(counter-shrine)
      - _x: .var(counter-dlc-shrine)
      - _x: .mul(with-dlc)
      - map-pct-items: .add(_x)
      - map-pct-items: .add(counter-calamity-ganon)
      - map-pct-items: .add(counter-dark-beast-ganon)
      - map-pct-items: .add(counter-divine-beast-done)
      - map-pct-items: .add(counter-divine-beast-enter)
      - _y: .var(counter-mazkoshia)
      - _y: .mul(with-dlc)
      - map-pct-items: .add(_y)
      - map-pct: .var(map-pct-items)
      - map-pct: .mul(100)
      - map-pct: .div(map-pct-items-total)
      - map-mul-100: .var(map-pct)
      - map-mul-100: .mul(100)
      - map-mul-100: .sub(0.5) # pad:lastの処理で数値が整数に四捨五入されることの調整
      - map-floor: .var(map-pct)
      - map-floor: .sub(0.5) # pad:lastの処理で数値が整数に四捨五入されることの調整
    $(0): '$(1) Map% - .var(pad 3:last3:map-floor).val(.).var(pad02:last2:map-mul-100).val(%)'
  
  mappct:
    vars:
      - map-pct-items: .var(counter-location)
      - map-pct-items: .add(counter-korok)
      - map-pct-items: .add(counter-tower)
      - map-pct-items: .add(counter-shrine)
      - _x: .var(counter-dlc-shrine)
      - _x: .mul(with-dlc)
      - map-pct-items: .add(_x)
      - map-pct-items: .add(counter-calamity-ganon)
      - map-pct-items: .add(counter-dark-beast-ganon)
      - map-pct-items: .add(counter-divine-beast-done)
      - map-pct-items: .add(counter-divine-beast-enter)
      - _y: .var(counter-mazkoshia)
      - _y: .mul(with-dlc)
      - map-pct-items: .add(_y)
      - map-pct: .var(map-pct-items)
      - map-pct: .mul(100)
      - map-pct: .div(map-pct-items-total)
      - map-mul-100: .var(map-pct)
      - map-mul-100: .mul(100)
      - map-mul-100: .sub(0.5) # pad:lastの処理で数値が整数に四捨五入されることの調整
      - map-floor: .var(map-pct)
      - map-floor: .sub(0.5) # pad:lastの処理で数値が整数に四捨五入されることの調整
    $(0): 'Map: .var(pad 3:last3:map-floor).val(.).var(pad02:last2:map-mul-100).val(%)'

  TowerMap%:
    text: '.var(pad 3:last3:map-floor).val(.).var(pad02:last2:map-mul-100).val(%) .cyan($(0))'
    icon: tower
    icon-priority: 0
    coord: [$(1),$(2),$(3)]
    counter: .var(counter-tower)
    vars:
      - map-pct-items: .var(counter-shrine)
      - _x: .var(counter-dlc-shrine)
      - _x: .mul(with-dlc)
      - map-pct-items: .add(_x)
      - map-pct-items: .add(counter-korok)
      - map-pct-items: .add(counter-location)
      - map-pct-items: .add(counter-tower)
      - map-pct-items: .add(1) # for this tower
      - map-pct-items: .add(counter-divine-beast-enter)
      - map-pct-items: .add(counter-divine-beast-done)
      - map-pct-items: .add(counter-calamity-ganon)
      - map-pct-items: .add(counter-dark-beast-ganon)
      - _y: .var(counter-mazkoshia)
      - _y: .mul(with-dlc)
      - map-pct-items: .add(_y)
      - map-pct: .var(map-pct-items)
      - map-pct: .div(map-pct-items-total)
      - _z: .var(map-pct)
      - map-pct: .mul(100)
      - map-mul-100: .var(map-pct)
      - map-mul-100: .mul(100)
      - map-mul-100: .sub(0.5) # pad:lastの処理で数値が整数に四捨五入されることの調整
      - map-floor: .var(map-pct)
      - map-floor: .sub(0.5) # pad:lastの処理で数値が整数に四捨五入されることの調整
    notes: .var(map-pct-items) / .var(map-pct-items-total) = .var(_z)

  Tower:
    text: .cyan($(0))
    icon: tower
    icon-priority: 0
    coord: [$(1),$(2),$(3)]
    counter: .var(counter-tower)
    vars:
      - map-pct-items: .var(counter-shrine)
      - _x: .var(counter-dlc-shrine)
      - _x: .mul(with-dlc)
      - map-pct-items: .add(_x)
      - map-pct-items: .add(counter-korok)
      - map-pct-items: .add(counter-location)
      - map-pct-items: .add(counter-tower)
      - map-pct-items: .add(1) # for this tower
      - map-pct-items: .add(counter-divine-beast-enter)
      - map-pct-items: .add(counter-divine-beast-done)
      - map-pct-items: .add(counter-calamity-ganon)
      - map-pct-items: .add(counter-dark-beast-ganon)
      - _y: .var(counter-mazkoshia)
      - _y: .mul(with-dlc)
      - map-pct-items: .add(_y)
    notes: .var(map-pct-items) / .var(map-pct-items-total)

